# Modified by VFS Platform contributors, 2026.
name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Reject password in URLs
        run: |
          if grep -R -F '?password=' src dist; then
            echo 'Password must not be included in URLs.' >&2
            exit 1
          fi
      - name: Verify release metadata
        run: node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.version!==l.version||p.version!==l.packages[''].version) process.exit(1)"
